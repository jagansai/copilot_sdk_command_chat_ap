[app]
commands.file = resources/commands.md
model = gpt-4.1
spinner.chars = ⠋,⠙,⠹,⠸,⠼,⠴,⠦,⠧,⠇,⠏
loading.message = Loading commands from: commands.md

[rag]
enabled = true
max.chunks = 3

[messages]
system.prompt = You are a helpful assistant that answers questions about admin commands. Use the following commands documentation to answer user questions accurately. If a user asks about a command, provide clear information including syntax, parameters, and examples.
goodbye = Goodbye! Thanks for using Command Chat Assistant!
